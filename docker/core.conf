# The core release this pack runs on: its images are the base of
# docker/*.Dockerfile, its pack-check.sh checks the pack, and its
# service-builder is vendored in .claude/skills/service-builder/.
# Change it with scripts/update-core.sh <version>, which updates all three;
# Renovate proposes new releases.
#
# The *_CORE_DIGEST lines pin each core image of that release by content, not
# just by tag: a tag can be pushed again, a digest cannot change. publish.yml
# builds on <image>:<version>@<digest>, and check.yml fails when the release's
# tags no longer point at these digests. update-core.sh writes them.
CORE_REPO=krixerx/cib7-react-poc
CORE_IMAGES=docker.io/krixerx
# renovate: datasource=github-releases depName=krixerx/cib7-react-poc
CORE_VERSION=2.1.0
ENGINE_CORE_DIGEST=sha256:21277ba79214cebb51203f63e584ff9ff687d2c4673d0ff9c55eb730722ab2cc
FRONTEND_CORE_DIGEST=sha256:5e3074a19f043749b8c282d4ec81ddde402fa8945479a907508bf84f464190f7
BACKEND_CORE_DIGEST=sha256:15df67a642f5cb71273736b75918dae7a11fe480ae5bcf668b077456f32bb72d
MCP_CORE_DIGEST=sha256:06dc9416eb90901f71041d2a164864bea59d4fa1bb8932d71fb2df65086ac595
